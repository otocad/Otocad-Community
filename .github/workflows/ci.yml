name: CI

# 跨平台编译 + 测试 OtoCAD 社区版核心 (Avalonia 桌面 + lcdb + lcinterface + LitMath + netDxf).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  # ============================================================
  # Build — 当前 net10.0-windows7.0 TFM 强制 Windows
  # (lcinterface 还依赖 WinForms 事件参数, 跨平台解耦留 v0.3+)
  # ============================================================
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/OtoCAD.slnx

      - name: Build (Debug)
        run: dotnet build src/OtoCAD.slnx -c Debug --no-restore

      - name: Build (Release)
        run: dotnet build src/OtoCAD.slnx -c Release --no-restore

  # ============================================================
  # Test — OtoCAD.Tests 117 个测试 (Lcdb / Annotation / Symbols / ...)
  # ============================================================
  test:
    name: Test (Windows)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: |
          dotnet test src/OtoCAD.Tests/OtoCAD.Tests.csproj `
            -c Debug --logger "console;verbosity=normal"
        shell: pwsh
