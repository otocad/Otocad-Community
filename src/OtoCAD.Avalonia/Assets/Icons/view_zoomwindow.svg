<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128px" height="128px">
  <defs>
    <linearGradient id="window-gradient1" gradientUnits="userSpaceOnUse">
      <stop style="stop-color: #4b70f5;"/>
    </linearGradient>
    <linearGradient id="window-gradient2" gradientUnits="userSpaceOnUse">
      <stop style="stop-color: #3dc2ec;"/>
    </linearGradient>
  </defs>
  <!-- 放大镜圆圈 -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#window-gradient1)" stroke-width="8"/>
  <!-- 放大镜手柄 -->
  <line x1="71" y1="71" x2="100" y2="100" stroke="url(#window-gradient1)" stroke-width="8" stroke-linecap="round"/>
  <!-- 窗口图标 -->
  <rect x="38" y="38" width="24" height="24" fill="none" stroke="url(#window-gradient2)" stroke-width="4" rx="2"/>
  <!-- 虚线选择框 -->
  <rect x="42" y="42" width="16" height="16" fill="none" stroke="url(#window-gradient2)" stroke-width="2" stroke-dasharray="2,2"/>
</svg>