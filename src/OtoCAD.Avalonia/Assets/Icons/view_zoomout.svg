<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128px" height="128px">
  <defs>
    <linearGradient id="zoomout-gradient1" gradientUnits="userSpaceOnUse">
      <stop style="stop-color: #4b70f5;"/>
    </linearGradient>
    <linearGradient id="zoomout-gradient2" gradientUnits="userSpaceOnUse">
      <stop style="stop-color: #3dc2ec;"/>
    </linearGradient>
  </defs>
  <!-- 放大镜圆圈 -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#zoomout-gradient1)" stroke-width="8"/>
  <!-- 放大镜手柄 -->
  <line x1="71" y1="71" x2="100" y2="100" stroke="url(#zoomout-gradient1)" stroke-width="8" stroke-linecap="round"/>
  <!-- 减号符号 -->
  <line x1="35" y1="50" x2="65" y2="50" stroke="url(#zoomout-gradient2)" stroke-width="6" stroke-linecap="round"/>
</svg>