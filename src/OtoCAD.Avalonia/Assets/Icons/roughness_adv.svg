<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- 高级粗糙度符号（带完整参数位置） -->
  <g stroke="#000000" stroke-width="2" fill="none">
    <!-- V形符号 -->
    <path d="M 10 20 L 16 10 L 22 20" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 横线（表示需要去除材料） -->
    <line x1="8" y1="10" x2="20" y2="10" stroke-width="1.5"/>
    
    <!-- 封闭短竖线（表示需要机加工） -->
    <line x1="20" y1="10" x2="20" y2="12" stroke-width="1.5"/>
    
    <!-- 圆圈（表示特殊处理） -->
    <circle cx="16" cy="10" r="2" fill="none" stroke-width="1"/>
    
    <!-- Ra文字 -->
    <text x="23" y="14" font-family="Arial" font-size="5" fill="#000000">Ra</text>
    
    <!-- 上限值 -->
    <text x="23" y="18" font-family="Arial" font-size="3.5" fill="#333333">1.6</text>
    
    <!-- 下限值 -->
    <text x="23" y="22" font-family="Arial" font-size="3.5" fill="#333333">0.8</text>
    
    <!-- 加工方法标记 -->
    <text x="6" y="8" font-family="Arial" font-size="3" fill="#666666">车</text>
    
    <!-- 纹理方向符号（平行线） -->
    <g stroke="#666666" stroke-width="0.5">
      <line x1="14" y1="24" x2="18" y2="24"/>
      <line x1="14" y1="26" x2="18" y2="26"/>
    </g>
  </g>
</svg>