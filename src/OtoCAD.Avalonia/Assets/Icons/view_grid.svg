<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128px" height="128px">
  <defs>
    <linearGradient id="grid-gradient" gradientUnits="userSpaceOnUse">
      <stop style="stop-color: #4b70f5;"/>
    </linearGradient>
  </defs>
  <!-- 网格线 -->
  <!-- 垂直线 -->
  <line x1="24" y1="24" x2="24" y2="104" stroke="url(#grid-gradient)" stroke-width="3"/>
  <line x1="44" y1="24" x2="44" y2="104" stroke="url(#grid-gradient)" stroke-width="3"/>
  <line x1="64" y1="24" x2="64" y2="104" stroke="url(#grid-gradient)" stroke-width="3"/>
  <line x1="84" y1="24" x2="84" y2="104" stroke="url(#grid-gradient)" stroke-width="3"/>
  <line x1="104" y1="24" x2="104" y2="104" stroke="url(#grid-gradient)" stroke-width="3"/>
  <!-- 水平线 -->
  <line x1="24" y1="24" x2="104" y2="24" stroke="url(#grid-gradient)" stroke-width="3"/>
  <line x1="24" y1="44" x2="104" y2="44" stroke="url(#grid-gradient)" stroke-width="3"/>
  <line x1="24" y1="64" x2="104" y2="64" stroke="url(#grid-gradient)" stroke-width="3"/>
  <line x1="24" y1="84" x2="104" y2="84" stroke="url(#grid-gradient)" stroke-width="3"/>
  <line x1="24" y1="104" x2="104" y2="104" stroke="url(#grid-gradient)" stroke-width="3"/>
</svg>