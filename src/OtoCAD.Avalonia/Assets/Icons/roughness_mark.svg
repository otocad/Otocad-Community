<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- 粗糙度基本符号（60度V形） -->
  <g stroke="#000000" stroke-width="2" fill="none">
    <!-- V形符号 -->
    <path d="M 8 22 L 16 8 L 24 22" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 横线（表示需要去除材料） -->
    <line x1="6" y1="8" x2="20" y2="8" stroke-width="1.5"/>
    
    <!-- Ra文字 -->
    <text x="24" y="16" font-family="Arial" font-size="6" fill="#000000">Ra</text>
  </g>
  
  <!-- 添加小的数值示例 -->
  <text x="24" y="22" font-family="Arial" font-size="4" fill="#666666">0.8</text>
</svg>